<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Approval Gate</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .truncate-cell {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }
        .truncate-sm {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl shadow-xl w-full max-w-md text-center transform transition-all">
            <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">এডমিন লগইন</h2>
            <p class="text-gray-500 mb-6 text-sm">অ্যাপের এক্সেস কন্ট্রোল প্যানেল</p>

            <input type="password" id="adminPassword" placeholder="এডমিন পাসওয়ার্ড দিন"
                onkeydown="if(event.key==='Enter'){login();}"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 transition-all">

            <button id="loginBtn" onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95">
                লগইন করুন <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by Default) -->
    <div id="dashboardSection" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-6">
                <div class="flex items-center gap-4 mb-4 md:mb-0">
                    <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-users-gear text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">ইউজার ম্যানেজমেন্ট</h1>
                        <p class="text-sm text-gray-500">অ্যাপ্রুভাল গেট কন্ট্রোল সিস্টেম</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="fetchDevices()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors font-medium">
                        <i class="fa-solid fa-rotate-right mr-1"></i> রিলোড
                    </button>
                    <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg transition-colors font-medium">
                        <i class="fa-solid fa-power-off mr-1"></i> লগআউট
                    </button>
                </div>
            </div>

            <!-- Stats + Filters -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">মোট ইউজার</p>
                    <p id="statTotal" class="text-2xl font-bold text-gray-900">0</p>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">অ্যাপ্রুভড</p>
                    <p id="statApproved" class="text-2xl font-bold text-green-600">0</p>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">পেন্ডিং</p>
                    <p id="statPending" class="text-2xl font-bold text-orange-500">0</p>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">রিজেক্টেড</p>
                    <p id="statRejected" class="text-2xl font-bold text-red-600">0</p>
                </div>
            </div>

            <!-- Search + Filter -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="নাম, ডিভাইস আইডি, মডেল বা ব্র্যান্ড দিয়ে খুঁজুন..."
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <select id="statusFilter" onchange="applyFilters()"
                    class="px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="all">সব স্ট্যাটাস</option>
                    <option value="approved">অ্যাপ্রুভড</option>
                    <option value="pending">পেন্ডিং</option>
                    <option value="rejected">রিজেক্টেড</option>
                </select>
            </div>

            <!-- Table Card -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                                <th class="p-4 font-semibold">নাম</th>
                                <th class="p-4 font-semibold">ডিভাইস</th>
                                <th class="p-4 font-semibold">OS</th>
                                <th class="p-4 font-semibold">ব্যাটারি</th>
                                <th class="p-4 font-semibold">RAM</th>
                                <th class="p-4 font-semibold">স্ট্যাটাস</th>
                                <th class="p-4 font-semibold">শেষ দেখা</th>
                                <th class="p-4 font-semibold text-right">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="deviceTableBody" class="divide-y divide-gray-100 text-sm">
                            <!-- Data will be injected here via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 sticky top-0 bg-white">
                <h3 class="text-lg font-bold">ডিভাইসের বিস্তারিত</h3>
                <button onclick="closeDetails()" class="w-9 h-9 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="detailsBody" class="p-5 space-y-3 text-sm">
                <!-- injected -->
            </div>
        </div>
    </div>

    <script>
        let currentPassword = localStorage.getItem('adminPass') || '';
        let allDevices = [];
        let busy = false;

        // Auto login check if password exists in local storage
        if (currentPassword) {
            fetchDevices();
        }

        // ---------- Helpers ----------
        function esc(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(dateStr) {
            try {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch (e) {
                return '—';
            }
        }

        function formatLastSeen(dateStr) {
            try {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '—';
                const diff = Math.floor((Date.now() - d.getTime()) / 1000);
                if (diff < 60) return 'এইমাত্র';
                if (diff < 3600) return Math.floor(diff / 60) + ' মিনিট আগে';
                if (diff < 86400) return Math.floor(diff / 3600) + ' ঘণ্টা আগে';
                if (diff < 604800) return Math.floor(diff / 86400) + ' দিন আগে';
                return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' });
            } catch (e) {
                return '—';
            }
        }

        function formatBattery(level) {
            if (level === undefined || level === null || level < 0) {
                return '<span class="text-gray-400 italic">—</span>';
            }
            const n = Number(level);
            if (!Number.isFinite(n)) return '<span class="text-gray-400 italic">—</span>';
            let color = 'text-green-600';
            let icon = 'fa-battery-full';
            if (n < 20) { color = 'text-red-600'; icon = 'fa-battery-quarter'; }
            else if (n < 50) { color = 'text-orange-500'; icon = 'fa-battery-half'; }
            return `<span class="${color} font-semibold"><i class="fa-solid ${icon} mr-1"></i>${n}%</span>`;
        }

        function formatMemory(bytes) {
            if (!bytes || bytes <= 0) return '<span class="text-gray-400 italic">—</span>';
            const n = Number(bytes);
            if (!Number.isFinite(n)) return '<span class="text-gray-400 italic">—</span>';
            if (n >= 1024 * 1024 * 1024) {
                return (n / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
            }
            if (n >= 1024 * 1024) {
                return (n / (1024 * 1024)).toFixed(0) + ' MB';
            }
            return n + ' B';
        }

        function deviceSummary(d) {
            const model = (d.model || '').trim();
            const brand = (d.brand || d.manufacturer || '').trim();
            if (model && brand) return brand + ' ' + model;
            if (model) return model;
            if (brand) return brand;
            return '';
        }

        // ---------- Auth ----------
        async function login() {
            if (busy) return;
            const passInput = document.getElementById('adminPassword').value;
            if (!passInput) {
                Swal.fire({ icon: 'warning', title: 'পাসওয়ার্ড দিন', text: 'লগইন করতে পাসওয়ার্ড প্রয়োজন' });
                return;
            }
            currentPassword = passInput;
            await fetchDevices();
        }

        function logout() {
            Swal.fire({
                title: 'লগআউট করবেন?',
                text: 'আপনি কি সত্যিই লগআউট করতে চান?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'হ্যাঁ, লগআউট',
                cancelButtonText: 'বাতিল'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentPassword = '';
                    localStorage.removeItem('adminPass');
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('dashboardSection').classList.add('hidden');
                    document.getElementById('loginSection').classList.remove('hidden');
                }
            });
        }

        // ---------- Data Fetch ----------
        async function fetchDevices() {
            if (busy) return;
            busy = true;
            try {
                Swal.fire({ title: 'লোড হচ্ছে...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                const response = await fetch('/api/admin/devices', {
                    headers: { 'x-admin-password': currentPassword }
                });

                if (response.status === 401) {
                    currentPassword = '';
                    localStorage.removeItem('adminPass');
                    Swal.fire({ icon: 'error', title: 'ভুল পাসওয়ার্ড', text: 'দয়া করে সঠিক এডমিন পাসওয়ার্ড দিন' });
                    document.getElementById('dashboardSection').classList.add('hidden');
                    document.getElementById('loginSection').classList.remove('hidden');
                    return;
                }

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                allDevices = Array.isArray(data) ? data : [];

                localStorage.setItem('adminPass', currentPassword);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');

                updateStats();
                applyFilters();
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'সার্ভার এরর', text: 'সার্ভারের সাথে কানেক্ট করা যাচ্ছে না!' });
            } finally {
                busy = false;
                Swal.close();
            }
        }

        // ---------- Stats ----------
        function updateStats() {
            const total = allDevices.length;
            const approved = allDevices.filter(d => d.approvalStatus === 'approved').length;
            const pending = allDevices.filter(d => d.approvalStatus === 'pending').length;
            const rejected = allDevices.filter(d => d.approvalStatus === 'rejected').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statRejected').textContent = rejected;
        }

        // ---------- Filters ----------
        function applyFilters() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const status = document.getElementById('statusFilter').value;

            const filtered = allDevices.filter(device => {
                const name = (device.name || '').toLowerCase();
                const deviceId = (device.deviceId || '').toLowerCase();
                const model = (device.model || '').toLowerCase();
                const brand = (device.brand || '').toLowerCase();
                const manufacturer = (device.manufacturer || '').toLowerCase();
                const matchQuery = !q || name.includes(q) || deviceId.includes(q) || model.includes(q) || brand.includes(q) || manufacturer.includes(q);
                const matchStatus = status === 'all' || device.approvalStatus === status;
                return matchQuery && matchStatus;
            });

            renderTable(filtered);
        }

        // ---------- Render ----------
        function renderTable(devices) {
            const tbody = document.getElementById('deviceTableBody');
            tbody.innerHTML = '';

            if (!devices || devices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">কোনো ইউজার ডাটা পাওয়া যায়নি</td></tr>`;
                return;
            }

            devices.forEach(device => {
                const nameRaw = device.name || '';
                const deviceIdRaw = device.deviceId || '';
                const deviceKey = device._id ? String(device._id) : deviceIdRaw;

                const nameDisplay = nameRaw
                    ? `<span class="truncate-cell" title="${esc(nameRaw)}">${esc(nameRaw)}</span>`
                    : `<span class="text-gray-400 italic">নাম দেয়নি</span>`;

                const summary = deviceSummary(device);
                const deviceDisplay = summary
                    ? `<span class="truncate-sm" title="${esc(summary)}">${esc(summary)}</span>`
                    : `<span class="text-gray-400 italic">—</span>`;

                const osDisplay = (device.osVersion || device.sdkInt)
                    ? `<span class="text-gray-600 text-xs">${esc(device.osVersion || '')}${device.sdkInt ? ' · SDK ' + esc(device.sdkInt) : ''}</span>`
                    : `<span class="text-gray-400 italic">—</span>`;

                const batteryDisplay = formatBattery(device.batteryLevel);
                const memoryDisplay = `<span class="text-gray-600 text-xs">${formatMemory(device.totalMemory)}</span>`;

                let statusBadge = '';
                if (device.approvalStatus === 'approved') {
                    statusBadge = `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-check mr-1"></i> অ্যাপ্রুভড</span>`;
                } else if (device.approvalStatus === 'rejected') {
                    statusBadge = `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-xmark mr-1"></i> রিজেক্টেড</span>`;
                } else {
                    statusBadge = `<span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-clock mr-1"></i> পেন্ডিং</span>`;
                }

                const lastSeen = formatLastSeen(device.lastSeenAt || device.createdAt);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                tr.innerHTML = `
                    <td class="p-4 font-medium text-gray-900">${nameDisplay}</td>
                    <td class="p-4">${deviceDisplay}</td>
                    <td class="p-4">${osDisplay}</td>
                    <td class="p-4">${batteryDisplay}</td>
                    <td class="p-4">${memoryDisplay}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-gray-500 text-xs">${esc(lastSeen)}</td>
                    <td class="p-4 text-right space-x-2 whitespace-nowrap">
                        <button onclick="showDetails('${esc(deviceKey)}')" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white transition-colors" title="Details">
                            <i class="fa-solid fa-circle-info"></i>
                        </button>
                        <button onclick="updateStatus('${esc(deviceKey)}', 'approved')" class="w-8 h-8 rounded-lg bg-green-50 text-green-600 hover:bg-green-500 hover:text-white transition-colors" title="Approve">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button onclick="updateStatus('${esc(deviceKey)}', 'rejected')" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-500 hover:text-white transition-colors" title="Reject">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <button onclick="deleteDevice('${esc(deviceKey)}')" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-800 hover:text-white transition-colors" title="Delete">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ---------- Details Modal ----------
        function findDevice(deviceKey) {
            return allDevices.find(d => String(d._id) === String(deviceKey) || String(d.deviceId) === String(deviceKey));
        }

        function detailRow(label, value) {
            return `<div class="flex justify-between items-start gap-3 border-b border-gray-100 pb-2">
                <span class="text-gray-500 shrink-0">${esc(label)}</span>
                <span class="text-gray-800 text-right break-all">${value || '<span class="text-gray-400 italic">—</span>'}</span>
            </div>`;
        }

        function showDetails(deviceKey) {
            const d = findDevice(deviceKey);
            if (!d) {
                Swal.fire('এরর', 'ডিভাইস পাওয়া যায়নি', 'error');
                return;
            }
            const body = document.getElementById('detailsBody');
            const nameRaw = d.name || '';
            const deviceKeySafe = esc(String(d._id || d.deviceId || ''));
            body.innerHTML = `
                ${detailRow('নাম', nameRaw ? esc(nameRaw) : '')}
                ${detailRow('ডিভাইস আইডি', esc(d.deviceId || ''))}
                ${detailRow('ব্র্যান্ড', esc(d.brand || ''))}
                ${detailRow('ম্যানুফ্যাকচারার', esc(d.manufacturer || ''))}
                ${detailRow('মডেল', esc(d.model || ''))}
                ${detailRow('OS ভার্সন', esc(d.osVersion || ''))}
                ${detailRow('SDK', d.sdkInt ? esc(d.sdkInt) : '')}
                ${detailRow('ব্যাটারি', formatBattery(d.batteryLevel))}
                ${detailRow('RAM', formatMemory(d.totalMemory))}
                ${detailRow('অ্যাপ ভার্সন', esc(d.appVersion || '') + (d.appVersionCode ? ' (' + esc(d.appVersionCode) + ')' : ''))}
                ${detailRow('ভাষা', esc(d.language || ''))}
                ${detailRow('স্ট্যাটাস', d.approvalStatus ? esc(d.approvalStatus) : '')}
                ${detailRow('তৈরি হয়েছে', esc(formatDate(d.createdAt)))}
                ${detailRow('শেষ দেখা', esc(formatLastSeen(d.lastSeenAt || d.createdAt)))}
            `;
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeDetails() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // Modal-এ বাইরে ক্লিক করলে বন্ধ
        document.getElementById('detailsModal').addEventListener('click', function (e) {
            if (e.target === this) closeDetails();
        });

        // ESC দিয়ে বন্ধ
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeDetails();
        });

        // ---------- Actions ----------
        async function updateStatus(deviceKey, status) {
            if (busy) return;
            const target = findDevice(deviceKey);
            if (!target) {
                Swal.fire('এরর', 'ডিভাইস পাওয়া যায়নি', 'error');
                return;
            }

            try {
                const response = await fetch('/api/admin/update-status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': currentPassword
                    },
                    body: JSON.stringify({ deviceId: target.deviceId, status })
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'সফল!',
                        text: `ইউজার স্ট্যাটাস ${status === 'approved' ? 'অ্যাপ্রুভ' : 'রিজেক্ট'} করা হয়েছে।`,
                        timer: 1500,
                        showConfirmButton: false
                    });
                    fetchDevices();
                } else {
                    throw new Error('Update failed');
                }
            } catch (error) {
                Swal.fire('এরর', 'স্ট্যাটাস আপডেট করা যায়নি', 'error');
            }
        }

        function deleteDevice(deviceKey) {
            const target = findDevice(deviceKey);
            if (!target) {
                Swal.fire('এরর', 'ডিভাইস পাওয়া যায়নি', 'error');
                return;
            }

            Swal.fire({
                title: 'আপনি কি নিশ্চিত?',
                text: "এই ইউজারের ডাটা চিরতরে মুছে যাবে!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'হ্যাঁ, ডিলিট করুন!',
                cancelButtonText: 'বাতিল'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch('/api/admin/delete', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-admin-password': currentPassword
                            },
                            body: JSON.stringify({ deviceId: target.deviceId })
                        });

                        if (response.ok) {
                            Swal.fire('ডিলিট হয়েছে!', 'ইউজার ডাটা মুছে ফেলা হয়েছে।', 'success');
                            fetchDevices();
                        } else {
                            throw new Error('Delete failed');
                        }
                    } catch (error) {
                        Swal.fire('এরর', 'ইউজার ডিলিট করা যায়নি', 'error');
                    }
                }
            });
        }
    </script>
</body>
